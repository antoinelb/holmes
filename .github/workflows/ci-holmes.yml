name: ci holmes

on:
  push:
    paths:
      - "src/holmes/**"
      - "tests/**"
      - "pyproject.toml"
    branches: [main, develop, "feature/**"]
    tags:
      - "*.*.*"
      - "!holmes-rs-*.*.*"
  pull_request:
    paths:
      - "src/holmes/**"
      - "tests/**"
      - "pyproject.toml"

env:
  MINIMUM_COVERAGE: 100

jobs:
  # =============================================================================
  # Test jobs - run on all triggers
  # =============================================================================

  static-analysis:
    runs-on: ubuntu-latest
    # backstop against hung network steps (GitHub's default is 360 min)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # --python overrides the repo's .python-version (3.14);
        # --all-extras because the download layer is type-checked too
        run: uv sync --group dev --all-extras --python 3.12

      - name: Check formatting (ruff)
        run: uv run --all-extras --python 3.12 ruff format --check src/holmes tests

      - name: Lint (ruff)
        run: uv run --all-extras --python 3.12 ruff check src/holmes tests

      - name: Type check (ty)
        run: uv run --all-extras --python 3.12 ty check src/holmes tests

  # unit and integration run as one job: the 100% coverage requirement holds
  # over both suites combined
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # --all-extras because the unit tests import the download layer
        run: uv sync --group dev --all-extras --python ${{ matrix.python }}

      - name: Build Rust extension
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          working-directory: src/holmes-rs

      - name: Run unit and integration tests with coverage
        run: uv run --all-extras --python ${{ matrix.python }} pytest tests/unit tests/integration -v --cov --cov-report=term-missing --cov-fail-under=$MINIMUM_COVERAGE

  e2e-tests:
    runs-on: ubuntu-latest
    # ~5x the normal runtime; a wedged browser or hung server fails fast
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      HOLMES_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev --python 3.14

      - name: Build Rust extension
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          working-directory: src/holmes-rs

      - name: Restore data archive
        # e2e boots the real server, which never builds data: extract the
        # latest dated zip from the rolling `data` release. Writing the
        # marker makes the startup sync a cheap up-to-date no-op (and
        # exercises the compare path). Map tiles are not pre-seeded; the
        # server fetches them lazily from CartoDB.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view data --json assets \
            --jq '[.assets[].name | select(test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.zip$"))] | sort | last // empty')"
          if [ -z "$latest" ]; then
            echo "no dated archive on the data release" >&2
            exit 1
          fi
          gh release download data --pattern "$latest" --output "$latest"
          mkdir -p data
          unzip -q "$latest" -d data
          stamp="${latest#data-}"
          echo "${stamp%.zip}" > data/archive_date.txt
          rm "$latest"

      - name: Install Playwright browsers
        timeout-minutes: 12
        # the apt half of --with-deps occasionally hangs on the Ubuntu
        # mirrors; kill a stalled attempt after 3 min and retry
        run: |
          for attempt in 1 2 3; do
            timeout 180 uv run playwright install ${{ matrix.browser }} --with-deps && exit 0
            echo "install attempt $attempt stalled or failed; retrying" >&2
          done
          exit 1

      - name: Run E2E tests
        run: uv run pytest tests/e2e -v --browser ${{ matrix.browser }}

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # =============================================================================
  # Publish job - only run on tags, after tests pass
  # =============================================================================

  publish:
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/holmes-rs-')
    needs: [static-analysis, tests, e2e-tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
