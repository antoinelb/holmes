site_name: HOLMES Documentation
site_description: HydrOLogical Modeling Educational Software - Documentation
site_author: Université Laval
site_url: https://antoinelb.github.io/holmes/
repo_url: https://github.com/antoinelb/holmes
repo_name: antoinelb/holmes
edit_uri: edit/main/docs/
dev_addr: 127.0.0.1:8001

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # navigation.instant is deliberately absent: it breaks the language
    # switcher's contextual links (mkdocs-static-i18n)
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: >-
            HydrOLogical Modeling Educational Software - Documentation
          nav_translations:
            Home: Accueil
            User guide: Guide d'utilisation
            Weather: Météo
            Model: Modèle
            Calibration: Calage
            Common workflows: Flux de travail courants
            Hydrological models: Modèles hydrologiques
            Snow models: Modèles de neige
            Potential evapotranspiration models: >-
              Modèles d'évapotranspiration potentielle
            Metrics: Métriques
            Reference: Référence
            Changelog: Journal des modifications
            License: Licence
  - awesome-nav
  - include-markdown
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antoinelb/holmes

# Navigation is managed by the awesome-nav plugin via .nav.yml files in the
# docs tree. See docs/.nav.yml for the top-level structure.
