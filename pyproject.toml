[project]
name = "holmes-hydro"
version = "4.2.1"
description = "HOLMES (HydrOLogical Modeling Educationnal Software) is a software developped to teach operational hydrology. It is developed at the university Laval, Québec, Canada."
readme = "README.md"
authors = [
  {name = "Antoine Lefebvre-Brossard", email = "antoinelb@proton.me"}
]
license = {text = "MIT"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "cdsapi>=0.7.7",
    "exactextract>=0.3.0",
    "gcsfs>=2026.7.0",
    "geopandas>=1.1.3",
    "holmes-rs>=0.7.0",
    "httpx>=0.28.1",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "platformdirs>=4",
    "polars>=1.41.0",
    "pystac-client>=0.9.0",
    "rioxarray>=0.22.0",
    "starlette>=1.0.0",
    "tqdm>=4.68.2",
    "typer>=0.26.3",
    "uvicorn>=0.47.0",
    "vl-convert-python>=1.9.0",
    "websockets>=16.0",
    "xarray>=2026.4.0",
    "zarr>=3.2.1",
]

[dependency-groups]
dev = [
    "maturin>=1.10.2",
    "mkdocs>=1.6.1",
    "mkdocs-awesome-nav>=3.1",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-include-markdown-plugin>=6.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-static-i18n>=1.2",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.15",
    "ty>=0.0.40",
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/antoinelb/holmes"
Repository = "https://github.com/antoinelb/holmes"

[tool.uv.sources]
holmes-rs = { path = "./src/holmes-rs", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holmes"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "pyproject.toml", "README.md"]

[project.scripts]
holmes = "holmes.cli:run_cli"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
# the pre-0.16 default rules the codebase was written against; ruff 0.16
# widened its defaults, which would flag hundreds of stylistic findings here
select = ["E4", "E7", "E9", "F"]

# ty ≥ 0.0.41 can no longer infer altair's generic mark_*/encode fluent
# chains (false unresolved-attribute); scoped to the two plotting modules
[[tool.ty.overrides]]
include = ["src/holmes/experiment.py", "src/holmes/preprocessing.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
# Order matters: unit tests must run before e2e to avoid event loop pollution from Playwright
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # xarray's netCDF4 writer still sets .shape on numpy arrays, deprecated
    # in NumPy 2.5; only their internals can fix it
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # starlette's TestClient prefers the httpx2 package, which this project
    # does not depend on; plain httpx keeps working
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # the netCDF4 wheel's Cython extension was built against an older NumPy;
    # the size-changed notice is harmless binary-compat chatter
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/holmes"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
